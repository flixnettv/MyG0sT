version: '3.8'

services:
  myghost:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      ACTIVE_MODEL: ${ACTIVE_MODEL:-ace3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      NENO_API_URL: ${NENO_API_URL}
      NENO_API_KEY: ${NENO_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      AGENT_NAME: ${AGENT_NAME:-MyGhost}
    volumes:
      - ./src:/app/src
    restart: unless-stopped
